<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapivarasChat</title>
    <link rel="icon" href="capivara.png">
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

    <!-- ============ TELA DE LOGIN ============ -->
    <div id="tela-login">
        <div class="login-caixa">
            <h1>CapivarasChat 🐾</h1>

            <div id="preview-capivara" class="capivara-sprite"></div>

            <input type="text" id="nickname-input" placeholder="Digite seu Nickname" maxlength="35" autocomplete="off">

            <label class="campo-cor" for="cor-input">
                Cor da capivara
                <input type="range" id="cor-input" min="0" max="360" value="0">
            </label>

            <select id="sala-input" aria-label="Sala inicial"></select>

            <button id="btn-entrar">Entrar na Cidade</button>
            <p id="erro-login" class="erro"></p>
            <p id="online-login" class="online-login"></p>
        </div>
    </div>

    <!-- ============ JOGO ============ -->
    <div id="jogo-container" data-sala="centro">
        <div id="cenario-fundo"></div>
        <div id="portas-container"></div>
        <div id="marcador-destino"></div>
        <div id="camada-jogadores"></div>
    </div>

    <!-- Barra superior: salas -->
    <nav id="barra-salas" class="hud"></nav>

    <!-- Moedas (clique abre o ranking) -->
    <button id="hud-moedas" class="hud" title="Suas moedas (clique para ver o ranking)">💰 <span id="qtd-moedas">0</span></button>

    <!-- Pergunta do quiz (Centro) -->
    <div id="quiz-banner" class="hud" hidden>
        <p><span class="quiz-icone">🧠</span> <span id="quiz-pergunta"></span></p>
        <div class="quiz-barra"><div id="quiz-progresso"></div></div>
    </div>

    <!-- Painel lateral: chat e online -->
    <aside id="painel" class="hud">
        <div class="painel-abas">
            <button class="aba ativa" data-aba="chat">💬 Chat</button>
            <button class="aba" data-aba="online">👥 <span id="contador-online">0</span></button>
            <button class="aba" data-aba="ranking">🏆 Ranking</button>
            <button id="btn-fechar-painel" title="Esconder painel">✕</button>
        </div>
        <ul id="lista-mensagens" class="painel-conteudo"></ul>
        <ul id="lista-online" class="painel-conteudo" hidden></ul>
        <div id="painel-ranking" class="painel-conteudo" hidden>
            <div id="ranking-categorias"></div>
            <ol id="lista-ranking"></ol>
            <p id="meus-numeros"></p>
        </div>
    </aside>
    <button id="btn-abrir-painel" class="hud" title="Mostrar chat" hidden>💬<span id="badge-nao-lidas" hidden></span></button>

    <!-- Botão do minigame da sala (ex.: pescaria na Praia) -->
    <button id="btn-minigame" class="hud" hidden></button>

    <!-- Barra inferior: emotes + chat -->
    <div id="chat-ui" class="hud">
        <div id="emotes">
            <button id="btn-bola" title="Bola de neve: clique para mirar (atalho: B ou botão direito do mouse)">❄️</button>
            <button data-emote="mortal" title="Dar mortal (/mortal)">🔄</button>
            <button data-emote="acenar" title="Acenar (/acenar)">👋</button>
            <button data-emote="dancar" title="Dançar (/dancar)">💃</button>
            <button data-emote="pular" title="Pular (/pular)">⬆️</button>
            <button data-emote="coracao" title="Coração (/coracao)">❤️</button>
            <button data-emote="risada" title="Risada (/risada)">😂</button>
            <button data-emote="dormir" title="Dormir (/dormir)">💤</button>
            <label class="cor-jogo" title="Mudar cor">🎨
                <input type="range" id="cor-jogo-input" min="0" max="360" value="0">
            </label>
        </div>
        <input type="text" id="chat-input" maxlength="60" placeholder="Fale algo... (Enter para enviar, /ajuda)" autocomplete="off">
    </div>

    <!-- Minigame do garçom (Cafeteria) -->
    <div id="garcom" hidden>
        <div class="garcom-caixa">
            <button id="garcom-sair" title="Parar de trabalhar">✕</button>
            <div class="garcom-topo">
                <span id="garcom-tempo">⏱️ 60s</span>
                <strong>☕ Garçom da Cafeteria</strong>
                <span id="garcom-placar">✅ 0</span>
            </div>

            <div id="garcom-jogo">
                <div class="garcom-cliente">
                    <span id="garcom-cliente-emoji">🐹</span>
                    <div id="garcom-pedido" class="garcom-itens" title="Pedido do cliente"></div>
                </div>
                <div class="garcom-bandeja">
                    <span>Bandeja:</span>
                    <div id="garcom-bandeja" class="garcom-itens" title="Clique num item para tirar"></div>
                </div>
                <div id="garcom-cardapio"></div>
                <div class="garcom-acoes">
                    <button id="garcom-limpar">🗑️ Limpar</button>
                    <button id="garcom-entregar">✅ Entregar</button>
                </div>
                <p class="garcom-dica">Atalhos: teclas 1–6 colocam itens, Backspace tira o último, Enter entrega.</p>
            </div>

            <div id="garcom-fim" hidden>
                <p id="garcom-resultado"></p>
                <div class="garcom-acoes">
                    <button id="garcom-denovo">🔁 Jogar de novo</button>
                    <button id="garcom-fechar">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
    <div id="status-conexao" hidden>Reconectando...</div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js?v=6"></script>
</body>
</html>
